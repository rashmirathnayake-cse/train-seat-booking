services:
  db:
    image: postgres:18-alpine
    container_name: train-booking-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-train_booking}
      POSTGRES_USER: ${POSTGRES_USER:-train_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-train_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/train_booking.dump:/docker-entrypoint-initdb.d/train_booking.dump:ro
      - ./database/01-restore-database.sh:/docker-entrypoint-initdb.d/01-restore-database.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-train_admin} -d ${POSTGRES_DB:-train_booking} && test -f /var/lib/postgresql/data/.restore-complete"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

    networks:
      - train-booking-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: train-booking-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-train_booking}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-train_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-train_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    networks:
      - train-booking-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: train-booking-frontend

    depends_on:
      backend:
        condition: service_started

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    networks:
      - train-booking-network


volumes:
  postgres_data:


networks:
  train-booking-network:
    driver: bridge